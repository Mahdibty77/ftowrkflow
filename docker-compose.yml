# ---------------------------------------------------------------------------
# Foolad Tabar Workflow - production stack (PostgreSQL + Django/gunicorn)
#
#   1. Copy .env.example to .env and fill in the values.
#   2. docker compose up -d --build
#
# Data that must survive restarts lives in named volumes:
#   postgres_data  - the main application database (cases, users, forms, ...)
#   media_data     - uploaded files (signatures, etc.)
#   code_db_data   - itemcoder reference code tables (pipe/valve/...). Seeded on
#                    first run from the data bundled in the image; admin uploads
#                    afterwards are kept here.
# ---------------------------------------------------------------------------
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ftworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-ftworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ftworkflow} -d ${POSTGRES_DB:-ftworkflow}"]
      interval: 5s
      timeout: 5s
      retries: 12

  # Cache backend, ready but not required. Runs unconditionally (idle it's a
  # few MB of RAM and no disk I/O), but nothing uses it until REDIS_URL is set
  # on the web service above. No persistence on purpose — --save "" — since
  # this only ever holds a cache: losing it costs nothing worth protecting.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ""
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 6

  web:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # --- database ---
      DJANGO_DB_ENGINE: postgres
      POSTGRES_DB: ${POSTGRES_DB:-ftworkflow}
      POSTGRES_USER: ${POSTGRES_USER:-ftworkflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # --- Django ---
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?set DJANGO_SECRET_KEY in .env}
      DJANGO_DEBUG: "0"
      # MUST be quoted: Compose/YAML otherwise keep only the first host token.
      DJANGO_ALLOWED_HOSTS: "${DJANGO_ALLOWED_HOSTS:-localhost 127.0.0.1}"
      DJANGO_CSRF_TRUSTED_ORIGINS: "${DJANGO_CSRF_TRUSTED_ORIGINS:-}"
      DJANGO_TIME_ZONE: ${DJANGO_TIME_ZONE:-Asia/Tehran}
      # There is no env_file here on purpose: every variable the app reads has
      # to be listed in this block, because Compose only uses .env to fill in
      # ${...} references. A setting that appears in .env but nowhere below is
      # simply never handed to the container, which is how the three knobs
      # further down (FTCO gate, Redis, HTTPS) used to be documented in
      # .env.example yet do nothing when set. Each default below reproduces the
      # value settings.py already falls back to, so nothing changes until the
      # operator actually sets one.
      # --- workflow policy ---
      # 1 = Technical cannot send a TO to Supply while a row lacks an FTCO code.
      REQUIRE_FTCO_CODE_TO_SUPPLY: "${REQUIRE_FTCO_CODE_TO_SUPPLY:-0}"
      # --- cache (optional) ---
      # Blank by default: the app falls back to the existing database-backed
      # cache when this is empty, so the redis service below (already running,
      # harmlessly idle) does not change anything until REDIS_URL is set in
      # .env, e.g. REDIS_URL=redis://redis:6379/0
      REDIS_URL: "${REDIS_URL:-}"
      # --- HTTPS (only behind a TLS-terminating proxy; DEPLOY.md section 10) ---
      # 1 = secure session/CSRF cookies, HTTPS redirect and HSTS. Leave 0 for a
      # plain-HTTP internal install, where turning it on locks everyone out.
      DJANGO_SECURE_SSL: "${DJANGO_SECURE_SSL:-0}"
      DJANGO_HSTS_SECONDS: "${DJANGO_HSTS_SECONDS:-31536000}"
      # --- offline license ---
      # Where the sealed license state + cached machine fingerprint are stored
      # (a persisted volume, so activation survives `docker compose up --build`).
      LICENSE_STATE_DIR: /app/.license
      # If you mount the host machine-id (see the commented bind-mount below),
      # it is folded into the fingerprint to tie the license to this host.
      LICENSE_HOST_MACHINE_ID_FILE: /host-machine-id
      # --- backups ---
      # Folder (inside the container) where backup archives live. It is bind-
      # mounted to ./backups on the host so files are accessible and copyable.
      BACKUP_DIR: /backups
      # --- gunicorn ---
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      # Threads per worker (entrypoint.sh explains the arithmetic). Total
      # requests the site can have in flight is workers x threads, so the
      # default is 12 rather than 3. It matters because a PDF export occupies
      # its slot for about four seconds while a headless Chromium runs, and
      # with only three slots three simultaneous exports stalled every other
      # click on the site for ~6 seconds. Threads are safe here because that
      # wait is spent in a child process and on a socket, both with the GIL
      # released. Set to 1 to go back to the old one-request-per-worker model.
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
      # Headless browsers one worker process may run at once. Each export is a
      # whole Chromium — measured at 16 OS processes and ~1.1 GB resident for a
      # six-sheet document — so this is what stops the extra threads above from
      # turning a burst of exports into a memory emergency. Exports past the
      # limit queue for a moment; they were seconds long already.
      FT_PDF_MAX_CONCURRENCY: ${FT_PDF_MAX_CONCURRENCY:-2}
      # Large code-table imports (millions of rows) run inside one request, so
      # give gunicorn a generous worker timeout. Without this a big "Import
      # group" would be killed mid-build and surface as an Internal Server Error.
      GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-600}
      # Headless Chromium for TO/PI PDF export (installed in the image).
      CHROME_PATH: /usr/bin/chromium
      # --- optional first admin (leave blank to create manually later) ---
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-}
    volumes:
      - media_data:/app/media
      # Docker seeds a named volume from the image ONLY at the moment it is
      # created empty; afterwards the volume shadows whatever the image ships.
      # So a corrected reference table baked into a new image does NOT reach an
      # existing deployment - it has to be re-imported from the admin Tool Data
      # page. See DEPLOY.md section 7.
      - code_db_data:/app/itemcoder/resources/db
      # itemcoder JSON configs (offer_*.json, rules_*.json, data.json,
      # asign_code.json, ...) are bind-mounted from the project folder so admin
      # edits made in the running app are written straight back to these files
      # on the host (immediately visible in VSCode/your editor) AND survive an
      # image rebuild. Without this bind the JSON lives only inside the copied
      # image, so edits appear in downloads but never in the project folder and
      # are lost on `docker compose up --build`.
      - ./itemcoder/resources/json:/app/itemcoder/resources/json
      # License state (sealed) + cached machine fingerprint -> must persist.
      - license_data:/app/.license
      # Backup archives live OUTSIDE the project folder, one level up next to it
      # (e.g. D:\Programing\ftworkflow\backups when the project is in
      # D:\Programing\ftworkflow\ftworkflow). Docker creates it on first run.
      # The web admin page and the backup service share this same host folder.
      - ../backups:/backups
      # OPTIONAL (Linux hosts only): tie the fingerprint to the host machine-id.
      # On Windows/macOS Docker Desktop leave this commented out.
      # - /etc/machine-id:/host-machine-id:ro
    ports:
      - "${WEB_PORT:-8000}:8000"

  # ---------------------------------------------------------------------------
  # Nightly backups + on-demand backup/restore worker.
  # Uses the same PostgreSQL 16 image as `db`, so pg_dump / psql versions match
  # the database exactly. It writes to ./backups on the host and performs the
  # backup/restore actions that the admin queues from the web "Backups" tab.
  #
  # Schedule (Asia/Tehran ~00:00), three folders under ../backups:
  #   - Daily:  PostgreSQL -> backups/db/ftdb_*.tar.gz           (keep BACKUP_DB_KEEP)
  #   - Every 3 days: media -> backups/media/ftmedia_*.tar.gz    (keep BACKUP_MEDIA_KEEP_DAYS)
  #   - Every 3 days: code SQLite -> backups/code_db/ftcode_db.tar.gz (replaced)
  # ---------------------------------------------------------------------------
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      # 00:00 nightly backups follow this timezone.
      TZ: ${DJANGO_TIME_ZONE:-Asia/Tehran}
      # Connection details for pg_dump / psql (PG* are read automatically).
      PGHOST: db
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-ftworkflow}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PGDATABASE: ${POSTGRES_DB:-ftworkflow}
      # Daily database archives to keep (older ones are deleted).
      BACKUP_DB_KEEP: ${BACKUP_DB_KEEP:-33}
      # Media archives older than this many days are deleted.
      BACKUP_MEDIA_KEEP_DAYS: ${BACKUP_MEDIA_KEEP_DAYS:-10}
    volumes:
      - ../backups:/backups         # host folder one level above the project
      - ./scripts:/scripts:ro       # backup/restore/scheduler scripts
      - media_data:/data/media      # uploaded files (read + write for restore)
      - code_db_data:/data/code_db  # code tables (read + write for restore)
      # license_data is deliberately NOT mounted here: sealed license state is
      # not app data and a portable copy of it is not something to spread across
      # backup archives. Losing that volume is recoverable by pasting the same
      # license string again - keep it somewhere safe. See DEPLOY.md section 11.
    entrypoint: ["/bin/sh", "/scripts/backup_service.sh"]

  # ---------------------------------------------------------------------------
  # Optional HTTPS front door for a deployment with no public domain (an
  # internal LAN server, e.g. DEPLOY.md section 12) — mkcert on the host
  # generates a certificate the operator installs on their own company
  # computers, and Caddy terminates TLS with it in front of "web". A PWA
  # "Install app" prompt (already wired — see static/manifest.json and
  # core/templates/base.html's service-worker registration) only ever offers
  # itself to a browser over HTTPS or localhost, which is the one thing a
  # plain "docker compose up" on an internal IP cannot give it.
  #
  # Behind the "https" PROFILE on purpose: a bare `docker compose up -d`
  # (every existing deployment's own command, unchanged) never starts this
  # service and nothing else in this file changes — "web" keeps answering on
  # WEB_PORT exactly as it always has. Opt in with:
  #   docker compose --profile https up -d --build
  # See DEPLOY.md section 12 for the full mkcert walkthrough.
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    profiles: ["https"]
    depends_on:
      - web
    environment:
      # Bare host/IP the certificate below was issued for, e.g. 192.168.1.50
      # or ftworkflow.local — no scheme, no port. Deliberately NOT a required
      # (":?") variable: Compose resolves every service's environment block
      # up front regardless of which profile is active, so a hard requirement
      # here would fail `docker compose up -d` for every deployment that has
      # never touched this profile and has no reason to set this var at all.
      # Left blank, Caddy itself refuses to start and says why in
      # `docker compose logs caddy` — the failure stays scoped to only
      # whoever actually opted into --profile https.
      FT_HTTPS_HOST: ${FT_HTTPS_HOST:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # mkcert -cert-file certs/ft.crt -key-file certs/ft.key <the same host>
      # — see DEPLOY.md section 12. Never committed (.gitignore'd): private
      # key material, generated per-deployment, not shared between servers.
      - ./certs:/certs:ro
      - caddy_data:/data
      - caddy_config:/config
    ports:
      - "${HTTPS_PORT:-443}:443"
      - "${HTTP_REDIRECT_PORT:-80}:80"

volumes:
  postgres_data:
  media_data:
  code_db_data:
  license_data:
  caddy_data:
  caddy_config:
